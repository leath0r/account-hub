<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.tile{flex:1;background:var(--surface);border:2px solid var(--border);border-radius:28px;padding:26px 30px;display:flex;flex-direction:column;gap:6px}
.num{font-family:'Unbounded',sans-serif;font-weight:700;font-size:56px;line-height:1}
.lbl{font-weight:600;font-size:26px;color:var(--muted)}
</style></head>
<body>
<div class="card">
  <svg class="bg" width="1280" height="640" viewBox="0 0 1280 640">
    <defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="40"/></filter></defs>
    <circle cx="180" cy="170" r="120" fill="#7C5CFC" opacity="0.22" filter="url(#glow)"/>
    <g stroke="#2DD4BF" stroke-width="3" stroke-opacity="0.6" fill="none">
      <polyline points="64,36 36,36 36,64"/><polyline points="1216,604 1244,604 1244,576"/>
    </g>
  </svg>
  <div class="content" style="gap:40px">
    <div style="display:flex;align-items:center;gap:40px">
      <div class="av g1" style="width:200px;height:200px;font-size:84px">M<span class="badge" style="background:var(--online)"></span></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="eyebrow">Аккаунт #2</div>
        <div class="h1" style="font-size:60px">Макс</div>
        <div class="sub">@account2 · +7 ••• ••• 12 34</div>
      </div>
      <div class="chip" style="margin-left:auto;align-self:flex-start"><span class="dot" style="background:var(--online)"></span>Онлайн</div>
    </div>
    <div style="margin-top:auto;display:flex;gap:24px">
      <div class="tile"><div class="num" style="color:var(--teal)">27</div><div class="lbl">непрочитанных</div></div>
      <div class="tile"><div class="num">142</div><div class="lbl">личных чата</div></div>
      <div class="tile"><div class="num">9</div><div class="lbl">групп и каналов</div></div>
    </div>
  </div>
</div>
</body></html>
