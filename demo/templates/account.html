{% from "macros.html" import avatar, corners, glow %}
<div class="card">
  <svg class="bg" width="1280" height="640" viewBox="0 0 1280 640">{{ glow(176, 164, glow_color) }}{{ corners() }}</svg>
  <div class="content" style="gap:40px">
    <div class="row" style="gap:40px">
      {{ avatar(a, 200) }}
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="eyebrow">{{ eyebrow }}</div>
        <div class="h1" style="font-size:60px">{{ a.name }}</div>
        <div class="sub">@{{ a.username }} · {{ a.phone_masked }}</div>
      </div>
      <div class="chip" style="margin-left:auto;align-self:flex-start"><span class="dot" style="background:{{ a.status_color }}"></span>{{ a.status_label }}</div>
    </div>
    <div class="row" style="margin-top:auto;gap:24px;align-items:stretch">
      {% for t in tiles %}
      <div class="tile"><div class="num" style="color:{{ t.color }}">{{ t.num }}</div><div class="lbl">{{ t.label }}</div></div>
      {% endfor %}
    </div>
  </div>
</div>
