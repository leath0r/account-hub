# Account Hub — запуск в Docker.
#
#   mkdir data && cp hub/.env.example data/.env   # впишите BOT_TOKEN, ADMIN_IDS, API_ID, API_HASH
#   docker compose up -d --build
#   docker compose logs -f
#
# В ./data живут .env (туда же сам допишется SESSION_KEY), hub.db с зашифрованными сессиями и hub.log.
# Бэкапить нужно именно эту папку. Ключ и база — вместе, по отдельности они бесполезны.
# Внутри контейнера бот работает от uid 1000: если data создана root'ом — sudo chown -R 1000:1000 data
services:
  hub:
    build: .
    image: account-hub
    container_name: account-hub
    restart: unless-stopped
    volumes:
      - ./data:/data
    # Telegram заблокирован у провайдера и прокси (xray/hysteria) слушает 127.0.0.1 на хосте?
    # Раскомментируйте — контейнер увидит localhost хоста, а в data/.env оставьте PROXY=socks5://127.0.0.1:10808
    # network_mode: host
    stop_grace_period: 20s
